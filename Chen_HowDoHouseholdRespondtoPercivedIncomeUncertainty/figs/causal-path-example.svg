<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">Randomized uncertainty sequences within households</title>
<desc id="desc">Each household answers under a guarantee and then faces lower and higher uncertainty in random order. Expected income stays fixed. Compare allocations within households and at equal uncertainty levels across sequences.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667074"/></marker></defs>
<rect width="1100" height="330" fill="white"/>
<g font-family="Helvetica Neue, Arial, sans-serif" fill="#1C2224" text-anchor="middle">
<text x="295" y="30" font-size="18" fill="#667074">Common baseline</text>
<text x="610" y="30" font-size="18" fill="#667074">First scenario</text>
<text x="945" y="30" font-size="18" fill="#667074">Second scenario</text>
<text x="90" y="99" font-size="21" font-weight="bold">Sequence A</text>
<text x="90" y="205" font-size="21" font-weight="bold">Sequence B</text>
<text x="295" y="99" font-size="22">Guaranteed income</text>
<text x="295" y="205" font-size="22">Guaranteed income</text>
<text x="610" y="99" font-size="22" fill="#128F78" font-weight="bold">Lower uncertainty</text>
<text x="945" y="99" font-size="22" fill="#C4452A" font-weight="bold">Higher uncertainty</text>
<text x="610" y="205" font-size="22" fill="#C4452A" font-weight="bold">Higher uncertainty</text>
<text x="945" y="205" font-size="22" fill="#128F78" font-weight="bold">Lower uncertainty</text>
<g stroke="#667074" stroke-width="1.7" marker-end="url(#arrow)">
<line x1="414" x2="491" y1="92" y2="92"/>
<line x1="730" x2="819" y1="92" y2="92"/>
<line x1="414" x2="491" y1="198" y2="198"/>
<line x1="730" x2="819" y1="198" y2="198"/>
</g>
<g font-size="17" fill="#667074">
<text x="295" y="129">Report allocation</text><text x="610" y="129">Report allocation</text><text x="945" y="129">Report allocation</text>
<text x="295" y="235">Report allocation</text><text x="610" y="235">Report allocation</text><text x="945" y="235">Report allocation</text>
</g>
<text x="550" y="289" font-size="21" font-weight="bold">Same expected income throughout</text>
<text x="550" y="318" font-size="18" fill="#667074">Each household follows one randomly assigned sequence.</text>
</g></svg>