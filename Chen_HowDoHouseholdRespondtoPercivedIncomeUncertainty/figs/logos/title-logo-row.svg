<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="120" viewBox="0 0 1120 120" role="img" aria-labelledby="title desc">
  <title id="title">University of Copenhagen, CEBI, SAFE, and Goethe University GSEFM</title>
  <desc id="desc">Four institutional wordmarks arranged horizontally.</desc>
  <g transform="translate(0 5)">
    <circle cx="45" cy="44" r="34" fill="#a71930"/>
    <text x="45" y="40" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="white">UCPH</text>
    <text x="45" y="54" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="white">1479</text>
    <text x="92" y="41" font-family="Georgia,serif" font-size="17" letter-spacing="1" fill="#55585a">UNIVERSITY OF</text>
    <text x="92" y="64" font-family="Georgia,serif" font-size="22" letter-spacing="1" fill="#55585a">COPENHAGEN</text>
    <path d="M92 76 H248" stroke="#a71930" stroke-width="2"/><circle cx="255" cy="76" r="4" fill="#a71930"/>
  </g>
  <g transform="translate(300 9)">
    <text x="0" y="34" font-family="Arial,sans-serif" font-weight="700" font-size="43" fill="#30343b"><tspan fill="#9d1c2f">C</tspan><tspan fill="#30343b">E</tspan><tspan fill="#9d1c2f">B</tspan><tspan fill="#30343b">I</tspan></text>
    <text x="0" y="58" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.2" fill="#535861">CENTER FOR ECONOMIC BEHAVIOR</text>
    <text x="0" y="75" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.2" fill="#535861">&amp; INEQUALITY</text>
  </g>
  <g transform="translate(600 12)">
    <rect x="0" y="0" width="36" height="36" fill="#1f5d92"/><rect x="39" y="0" width="36" height="36" fill="#83b441"/>
    <rect x="0" y="39" width="36" height="36" fill="#83b441"/><rect x="39" y="39" width="36" height="36" fill="#1f5d92"/>
    <text x="18" y="26" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="white">S</text>
    <text x="57" y="26" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="white">A</text>
    <text x="18" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="white">F</text>
    <text x="57" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="white">E</text>
    <text x="90" y="30" font-family="Arial,sans-serif" font-size="13" letter-spacing=".8" fill="#424850">LEIBNIZ INSTITUTE</text>
    <text x="90" y="51" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#424850">SAFE</text>
    <text x="90" y="70" font-family="Arial,sans-serif" font-size="10" fill="#69717a">FINANCIAL RESEARCH</text>
  </g>
  <g transform="translate(860 12)">
    <text x="0" y="35" font-family="Georgia,serif" font-size="38" font-weight="bold" fill="#153c65">GSEFM</text>
    <path d="M0 44 H211" stroke="#153c65" stroke-width="1.5"/>
    <text x="0" y="62" font-family="Arial,sans-serif" font-size="9.5" letter-spacing=".45" fill="#414a54">GRADUATE SCHOOL OF ECONOMICS,</text>
    <text x="0" y="77" font-family="Arial,sans-serif" font-size="9.5" letter-spacing=".45" fill="#414a54">FINANCE AND MANAGEMENT · GOETHE UNIVERSITY</text>
  </g>
</svg>
