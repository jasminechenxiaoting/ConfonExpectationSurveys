<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Survey stages 1–3 with repeated allocation questions</title>
<desc id="desc">Stage 1 guarantees unchanged income with no income uncertainty. At Stage 2, groups 1 and 2 face plus or minus 20 percent income changes with equal probabilities, while groups 3 and 4 face plus or minus 40 percent changes. At Stage 3, group 1 switches to plus or minus 40 percent and group 3 switches to plus or minus 20 percent, both with equal probabilities. Groups 2 and 4 enter the separate ambiguity component. Allocation fields are repeated at each stage.</desc>
<defs><marker id="next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667074" /></marker></defs>
<rect width="1100" height="420" fill="white" />
<g font-family="Helvetica Neue, Arial, sans-serif" fill="#1C2224">
<text x="180" y="29" font-size="22" text-anchor="middle" font-weight="bold">Stage 1</text>
<line x1="40" y1="46" x2="320" y2="46" stroke="#C9CEC6" stroke-width="1.5" />
<text x="550" y="29" font-size="22" text-anchor="middle" font-weight="bold">Stage 2</text>
<line x1="400" y1="46" x2="700" y2="46" stroke="#C9CEC6" stroke-width="1.5" />
<text x="920" y="29" font-size="22" text-anchor="middle" font-weight="bold">Stage 3</text>
<line x1="780" y1="46" x2="1060" y2="46" stroke="#C9CEC6" stroke-width="1.5" />
<text x="180" y="160" font-size="23" text-anchor="middle" font-weight="bold">Guaranteed income</text>
<text x="180" y="190" font-size="18" text-anchor="middle">Income unchanged</text>
<text x="180" y="221" font-size="18" text-anchor="middle" font-weight="bold">No income uncertainty</text>
<line x1="330" y1="191" x2="360" y2="191" stroke="#C9CEC6" stroke-width="1.5" />
<line x1="360" y1="191" x2="390" y2="115" stroke="#C9CEC6" stroke-width="1.5" marker-end="url(#next)" />
<line x1="360" y1="191" x2="390" y2="244" stroke="#C9CEC6" stroke-width="1.5" marker-end="url(#next)" />
<text x="360" y="165" font-size="12" text-anchor="middle">Random</text>
<text x="360" y="179" font-size="12" text-anchor="middle">assignment</text>
<text x="550" y="82" font-size="19" text-anchor="middle" font-weight="bold">Groups 1 &amp; 2</text>
<text x="550" y="113" font-size="22" text-anchor="middle" font-weight="bold" fill="#128F78">±20% income uncertainty</text>
<text x="550" y="139" font-size="17" text-anchor="middle">50–50 probabilities</text>
<text x="550" y="211" font-size="19" text-anchor="middle" font-weight="bold">Groups 3 &amp; 4</text>
<text x="550" y="242" font-size="22" text-anchor="middle" font-weight="bold" fill="#C4452A">±40% income uncertainty</text>
<text x="550" y="268" font-size="17" text-anchor="middle">50–50 probabilities</text>
<text x="920" y="82" font-size="19" text-anchor="middle" font-weight="bold">Group 1</text>
<text x="920" y="113" font-size="22" text-anchor="middle" font-weight="bold" fill="#C4452A">±40% income uncertainty</text>
<text x="920" y="139" font-size="17" text-anchor="middle">50–50 probabilities</text>
<text x="920" y="211" font-size="19" text-anchor="middle" font-weight="bold">Group 3</text>
<text x="920" y="242" font-size="22" text-anchor="middle" font-weight="bold" fill="#128F78">±20% income uncertainty</text>
<text x="920" y="268" font-size="17" text-anchor="middle">50–50 probabilities</text>
<line x1="710" y1="113" x2="770" y2="113" stroke="#C9CEC6" stroke-width="1.5" marker-end="url(#next)" />
<text x="740" y="100" font-size="12" text-anchor="middle">Group 1</text>
<line x1="710" y1="242" x2="770" y2="242" stroke="#C9CEC6" stroke-width="1.5" marker-end="url(#next)" />
<text x="740" y="229" font-size="12" text-anchor="middle">Group 3</text>
<line x1="30" x2="1070" y1="300" y2="300" stroke="#C9CEC6" />
<text x="550" y="328" text-anchor="middle" font-size="17" font-weight="700">At each stage: allocate current monthly household income</text>
<text x="75" y="365" font-size="16" fill="#C4452A">For spending</text>
<rect x="250" y="345" width="65" height="28" rx="4" fill="white" stroke="#C9CEC6" /><text x="283" y="365" text-anchor="middle" font-size="15">____%</text>
<text x="430" y="365" font-size="16" fill="#128F78">For saving</text>
<rect x="605" y="345" width="65" height="28" rx="4" fill="white" stroke="#C9CEC6" /><text x="638" y="365" text-anchor="middle" font-size="15">____%</text>
<text x="785" y="365" font-size="16" fill="#B8760A">For debt repayment</text>
<rect x="960" y="345" width="65" height="28" rx="4" fill="white" stroke="#C9CEC6" /><text x="993" y="365" text-anchor="middle" font-size="15">____%</text>
<text x="550" y="406" text-anchor="middle" font-size="16" fill="#667074">The three allocations must sum to 100%.</text>
</g></svg>