<svg xmlns="http://www.w3.org/2000/svg" width="620" height="390" viewBox="0 0 620 390" role="img" aria-labelledby="title desc">
<title id="title">A mean-preserving income spread</title>
<desc id="desc">Jasmine's current income branches into equally likely higher and lower income, symmetrically around a dashed line marking unchanged expected income. Each branch has probability one half.</desc>
<rect width="620" height="390" fill="white"/>
<g font-family="Helvetica Neue, Arial, sans-serif" fill="#1C2224">
<text x="20" y="177" font-size="20" font-weight="700">Jasmine</text>
<text x="20" y="204" font-size="17">Current income</text>
<path d="M 162 195 H 235" stroke="#1C2224" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<path d="M 235 195 C 325 195 345 75 458 75" stroke="#1C2224" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<path d="M 235 195 C 325 195 345 315 458 315" stroke="#1C2224" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<line x1="235" x2="600" y1="195" y2="195" stroke="#667074" stroke-width="1.4" stroke-dasharray="5 6"/>
<text x="600" y="181" text-anchor="end" font-size="17" fill="#667074">Same on average</text>
<g fill="white" stroke="#1C2224">
<circle cx="343" cy="127" r="25" stroke-width="3"/>
<circle cx="343" cy="263" r="25" stroke-width="3"/>
<circle cx="343" cy="127" r="19" stroke="#667074" stroke-dasharray="2 3"/>
<circle cx="343" cy="263" r="19" stroke="#667074" stroke-dasharray="2 3"/>
</g>
<text x="343" y="133" text-anchor="middle" font-size="18" font-weight="700">½</text>
<text x="343" y="269" text-anchor="middle" font-size="18" font-weight="700">½</text>
<text x="475" y="70" font-size="20" font-weight="700">Higher income</text>
<text x="475" y="96" font-size="16" fill="#667074">Equal-sized gain</text>
<text x="475" y="310" font-size="20" font-weight="700">Lower income</text>
<text x="475" y="336" font-size="16" fill="#667074">Equal-sized loss</text>
<text x="310" y="379" text-anchor="middle" font-size="18" fill="#667074">Equal chances · unchanged expected income</text>
</g></svg>