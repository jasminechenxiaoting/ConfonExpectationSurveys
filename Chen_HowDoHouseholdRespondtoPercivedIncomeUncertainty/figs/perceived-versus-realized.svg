<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc"><title id="title">Realized income and perceived future uncertainty</title><desc id="desc">An observed historical income series contrasts with subjective probabilities about future income. No comparison of means is imposed.</desc><rect width="1100" height="320" fill="white"/><g font-family="Helvetica Neue, Arial, sans-serif" fill="#1C2224" text-anchor="middle"><text x="270" y="37" font-size="26" font-weight="700">Realized income</text><text x="825" y="37" font-size="26" font-weight="700" fill="#C4452A">Perceived income uncertainty</text><text x="270" y="72" font-size="19">What happened in the past</text><text x="825" y="72" font-size="19">What the household thinks could happen</text><path d="M 70 240 H 470 M 70 240 V 105" stroke="#C9CEC6" fill="none"/><polyline points="85,194 150,185 215,199 280,151 345,168 410,131 460,143" fill="none" stroke="#667074" stroke-width="4"/><text x="270" y="276" font-size="19">Income records over time</text><path d="M 620 240 H 1030" stroke="#C9CEC6"/><path d="M 635 240 C 700 240 728 227 760 184 C 785 146 793 118 826 118 C 861 118 875 174 906 205 C 944 238 982 240 1017 240" stroke="#C4452A" stroke-width="4" fill="none"/><text x="825" y="276" font-size="19">Probabilities over future income</text></g></svg>