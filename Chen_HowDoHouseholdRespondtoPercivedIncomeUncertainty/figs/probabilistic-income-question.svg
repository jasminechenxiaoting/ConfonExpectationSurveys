<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">Probabilities assigned to changes in monthly household income</title>
<desc id="desc">Illustrative probabilities across twelve euro income-change bins. Probabilities sum to 100 percent. The largest probability is on an increase of 250 to 500 euros.</desc>
<rect width="1100" height="330" fill="white"/>
<g font-family="Helvetica Neue, Arial, sans-serif" fill="#1C2224">
<text x="68" y="24" font-size="21" text-anchor="start" font-weight="bold" fill="#1C2224">How likely is each change in your monthly household income over the next 12 months?</text>
<text x="68" y="52" font-size="16" text-anchor="start" font-weight="normal" fill="#667074">Assigned probability</text>
<text x="1070" y="52" font-size="16" text-anchor="end" font-weight="normal" fill="#667074">Illustrative answer · total 100%</text>
<line x1="68" x2="1070" y1="238" y2="238" stroke="#E3E6E0" stroke-width="1"/>
<text x="57" y="243" font-size="15" text-anchor="end" font-weight="normal" fill="#667074">0%</text>
<line x1="68" x2="1070" y1="198" y2="198" stroke="#E3E6E0" stroke-width="1"/>
<text x="57" y="203" font-size="15" text-anchor="end" font-weight="normal" fill="#667074">10%</text>
<line x1="68" x2="1070" y1="158" y2="158" stroke="#E3E6E0" stroke-width="1"/>
<text x="57" y="163" font-size="15" text-anchor="end" font-weight="normal" fill="#667074">20%</text>
<line x1="68" x2="1070" y1="118" y2="118" stroke="#E3E6E0" stroke-width="1"/>
<text x="57" y="123" font-size="15" text-anchor="end" font-weight="normal" fill="#667074">30%</text>
<line x1="68" x2="1070" y1="78" y2="78" stroke="#E3E6E0" stroke-width="1"/>
<text x="57" y="83" font-size="15" text-anchor="end" font-weight="normal" fill="#667074">40%</text>
<line x1="94" x2="126" y1="238" y2="238" stroke="#C9CEC6" stroke-width="3"/>
<text x="110" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">Below</text>
<text x="110" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">−2,000</text>
<line x1="177" x2="209" y1="238" y2="238" stroke="#C9CEC6" stroke-width="3"/>
<text x="193" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">−2,000 to</text>
<text x="193" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">−1,500</text>
<line x1="260" x2="292" y1="238" y2="238" stroke="#C9CEC6" stroke-width="3"/>
<text x="276" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">−1,500 to</text>
<text x="276" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">−1,000</text>
<rect x="332" y="218" width="54" height="20" rx="2" fill="#C4452A"/>
<text x="359" y="210" font-size="17" text-anchor="middle" font-weight="bold" fill="#C4452A">5%</text>
<text x="359" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">−1,000 to</text>
<text x="359" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">−500</text>
<rect x="415" y="198" width="54" height="40" rx="2" fill="#C4452A"/>
<text x="442" y="190" font-size="17" text-anchor="middle" font-weight="bold" fill="#C4452A">10%</text>
<text x="442" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">−500 to</text>
<text x="442" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">−250</text>
<rect x="498" y="178" width="54" height="60" rx="2" fill="#C4452A"/>
<text x="525" y="170" font-size="17" text-anchor="middle" font-weight="bold" fill="#C4452A">15%</text>
<text x="525" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">−250 to</text>
<text x="525" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">0</text>
<rect x="581" y="138" width="54" height="100" rx="2" fill="#128F78"/>
<text x="608" y="130" font-size="17" text-anchor="middle" font-weight="bold" fill="#128F78">25%</text>
<text x="608" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">0 to</text>
<text x="608" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">250</text>
<rect x="664" y="98" width="54" height="140" rx="2" fill="#128F78"/>
<text x="691" y="90" font-size="17" text-anchor="middle" font-weight="bold" fill="#128F78">35%</text>
<text x="691" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">250 to</text>
<text x="691" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">500</text>
<rect x="747" y="198" width="54" height="40" rx="2" fill="#128F78"/>
<text x="774" y="190" font-size="17" text-anchor="middle" font-weight="bold" fill="#128F78">10%</text>
<text x="774" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">500 to</text>
<text x="774" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">1,000</text>
<line x1="841" x2="873" y1="238" y2="238" stroke="#C9CEC6" stroke-width="3"/>
<text x="857" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">1,000 to</text>
<text x="857" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">1,500</text>
<line x1="924" x2="956" y1="238" y2="238" stroke="#C9CEC6" stroke-width="3"/>
<text x="940" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">1,500 to</text>
<text x="940" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">2,000</text>
<line x1="1007" x2="1039" y1="238" y2="238" stroke="#C9CEC6" stroke-width="3"/>
<text x="1023" y="261" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">Above</text>
<text x="1023" y="280" font-size="14" text-anchor="middle" font-weight="normal" fill="#1C2224">2,000</text>
<line x1="566.5" x2="566.5" y1="73" y2="240" stroke="#C9CEC6" stroke-dasharray="4 5"/>
<text x="570" y="316" font-size="18" text-anchor="middle" font-weight="normal" fill="#1C2224">Change in monthly household income (€)</text>
</g></svg>