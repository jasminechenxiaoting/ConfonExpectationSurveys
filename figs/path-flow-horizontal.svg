<line x1="30" x2="1070" y1="300" y2="300" stroke="#C9CEC6" /><text x="550" y="328" text-anchor="middle" font-size="17" font-weight="700">At every stage: allocate current monthly household income</text><text x="75" y="365" font-size="16" fill="#C4452A">For spending</text><rect x="250" y="345" width="65" height="28" rx="4" fill="white" stroke="#C9CEC6" /><text x="283" y="365" text-anchor="middle" font-size="15">____%</text><text x="430" y="365" font-size="16" fill="#128F78">For saving</text><rect x="605" y="345" width="65" height="28" rx="4" fill="white" stroke="#C9CEC6" /><text x="638" y="365" text-anchor="middle" font-size="15">____%</text><text x="785" y="365" font-size="16" fill="#B8760A">For debt repayment</text><rect x="960" y="345" width="65" height="28" rx="4" fill="white" stroke="#C9CEC6" /><text x="993" y="365" text-anchor="middle" font-size="15">____%</text><text x="550" y="406" text-anchor="middle" font-size="16" fill="#667074">The three allocations must sum to 100%.</text></g></svg>