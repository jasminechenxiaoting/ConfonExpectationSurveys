<text x="130" y="160" font-size="23" text-anchor="middle" font-weight="bold" fill="#1C2224" opacity="0.55">Prior allocation</text>
<text x="130" y="190" font-size="17" text-anchor="middle" font-weight="normal" fill="#1C2224" opacity="0.55">Prior perceived uncertainty</text>
<text x="130" y="215" font-size="15" text-anchor="middle" font-weight="normal" fill="#667074" opacity="0.55">Measured in BOP-HH</text>
<text x="130" y="235" font-size="14" text-anchor="middle" font-weight="normal" fill="#667074" opacity="0.55">with the probabilistic question</text>
<text x="400" y="160" font-size="23" text-anchor="middle" font-weight="bold" fill="#1C2224">Guaranteed income</text>
