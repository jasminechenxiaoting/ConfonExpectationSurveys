<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Path dependence: opposite uncertainty sequences</title>
<desc id="desc">Left-to-right stages with the entire prior-collection stage dashed. Group 1 faces 20 then 40 percent spreads; group 3 faces 40 then 20 percent, with equal probabilities.</desc>
