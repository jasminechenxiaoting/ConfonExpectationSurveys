<line x1="518" y1="191" x2="553" y2="191" stroke="#C9CEC6" stroke-width="1.5" />
<line x1="553" y1="191" x2="567" y2="115" stroke="#C9CEC6" stroke-width="1.5" marker-end="url(#next)" />
<line x1="553" y1="191" x2="567" y2="244.0" stroke="#C9CEC6" stroke-width="1.5" marker-end="url(#next)" />
<text x="539" y="171" font-size="12" text-anchor="middle" font-weight="normal" fill="#1C2224">Random</text>
