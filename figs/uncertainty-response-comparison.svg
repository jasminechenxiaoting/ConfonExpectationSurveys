<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
<title id="title">From guaranteed income to an exogenous income spread</title>
<desc id="desc">Stage 1 guarantees unchanged income. At Stage 2, groups 1 and 2 face plus or minus 20 percent and groups 3 and 4 face plus or minus 40 percent, each with equal probabilities. Expected income stays fixed.</desc>
<defs><marker id="next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667074"/></marker></defs>
<rect width="1100" height="380" fill="white"/>
<g font-family="Helvetica Neue, Arial, sans-serif" fill="#1C2224" text-anchor="middle">
<text x="255" y="39" font-size="24" font-weight="700">Stage 1</text><text x="805" y="39" font-size="24" font-weight="700">Stage 2</text>
<text x="255" y="164" font-size="31" font-weight="700">Guaranteed income</text><text x="255" y="203" font-size="25">No income uncertainty</text><text x="255" y="239" font-size="20" fill="#667074">Income stays unchanged</text>
<g fill="none" stroke="#667074" stroke-width="2.5" marker-end="url(#next)"><path d="M 445 185 H 500 L 595 116"/><path d="M 500 185 L 595 266"/></g>
<text x="805" y="88" font-size="21" fill="#667074">Groups 1 &amp; 2</text><text x="805" y="125" font-size="30" font-weight="700" fill="#128F78">±20% income spread</text><text x="805" y="157" font-size="21">50–50 probabilities</text>
<text x="805" y="235" font-size="21" fill="#667074">Groups 3 &amp; 4</text><text x="805" y="272" font-size="30" font-weight="700" fill="#C4452A">±40% income spread</text><text x="805" y="304" font-size="21">50–50 probabilities</text>
<text x="550" y="368" font-size="25" font-weight="700">Expected income stays fixed.</text>
</g></svg>